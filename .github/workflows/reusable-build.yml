name: Reusable Build & Test

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      build_type:
        required: true
        type: string
      cc:
        required: false
        type: string
      cxx:
        required: false
        type: string
      cmake_generator:
        required: true
        type: string
      cmake_args:
        required: false
        type: string
      artifact_name:
        required: true
        type: string

jobs:
  build:
    name: Build on ${{ inputs.os }} (${{ inputs.build_type }})
    runs-on: ${{ inputs.os }}

    defaults:
      run:
        shell: pwsh # Use PowerShell for cross-platform consistency

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Latest LLVM and Dependencies
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '19'     
      
      - name: Setup Ninja (for non-Windows)
        if: runner.os != 'Windows'
        uses: ashutoshvarma/setup-ninja@master

      - name: Configure Environment and LLVM Paths
        id: setup_llvm
        run: |
          # Print environment info for debugging
          Write-Host "=== Environment Information ==="
          Write-Host "Runner OS: ${{ runner.os }}"
          Write-Host "Build Type: ${{ inputs.build_type }}"
          Write-Host "CMake Generator: ${{ inputs.cmake_generator }}"
          
          # Check LLVM installation and configure paths
          if (Get-Command llvm-config -ErrorAction SilentlyContinue) {
            Write-Host "=== LLVM Configuration ==="
            $llvmVersion = llvm-config --version
            $llvmIncludeDir = llvm-config --includedir
            $llvmLibDir = llvm-config --libdir
            $llvmCMakeDir = llvm-config --cmakedir
            
            Write-Host "LLVM Version: $llvmVersion"
            Write-Host "LLVM Include Dir: $llvmIncludeDir"
            Write-Host "LLVM Lib Dir: $llvmLibDir"
            Write-Host "LLVM CMake Dir: $llvmCMakeDir"
            
            # Set output variables for CMake configuration
            echo "llvm_cmake_dir=$llvmCMakeDir" >> $env:GITHUB_OUTPUT
            echo "llvm_include_dir=$llvmIncludeDir" >> $env:GITHUB_OUTPUT
            echo "llvm_lib_dir=$llvmLibDir" >> $env:GITHUB_OUTPUT
            
            # Also check what LLVM components are available
            Write-Host "=== Available LLVM Components ==="
            llvm-config --components | Write-Host
          } else {
            Write-Host "WARNING: llvm-config not found in PATH"
            # Try to find LLVM installation manually
            if ($IsWindows) {
              $possiblePaths = @("C:\Program Files\LLVM", "C:\Program Files (x86)\LLVM", "$env:ProgramFiles\LLVM")
            } else {
              $possiblePaths = @("/usr/local", "/usr", "/opt/llvm")
            }
              foreach ($path in $possiblePaths) {
              if (Test-Path "$path/bin/llvm-config") {
                Write-Host "Found LLVM at: $path"
                echo "llvm_cmake_dir=$path/lib/cmake/llvm" >> $env:GITHUB_OUTPUT
                break
              }
            }
          }
          
          # Check for CMake
          Write-Host "=== CMake Information ==="
          cmake --version

      - name: Configure CMake
        env:
          CC: ${{ inputs.cc }}
          CXX: ${{ inputs.cxx }}
        run: |
          # Configure with LLVM support
          $cmakeArgs = @(
            "-B", "build",
            "-G", "${{ inputs.cmake_generator }}",
            "-DCMAKE_BUILD_TYPE=${{ inputs.build_type }}",
            "-DLOOM_USE_LLVM=ON",
            "-DLOOM_BUILD_TESTING=ON",
            "-DLOOM_BUILD_EXAMPLES=ON"
          )
          
          # Add any additional CMake args
          if ("${{ inputs.cmake_args }}" -ne "") {
            $cmakeArgs += "${{ inputs.cmake_args }}".Split(" ")
          }
          
          # Add LLVM paths if available
          if ("${{ steps.setup_llvm.outputs.llvm_cmake_dir }}" -ne "") {
            $llvmCMakeDir = "${{ steps.setup_llvm.outputs.llvm_cmake_dir }}"
            Write-Host "Using LLVM CMake dir: $llvmCMakeDir"
            $cmakeArgs += "-DLLVM_DIR=$llvmCMakeDir"
          }
          
          Write-Host "CMake command: cmake $($cmakeArgs -join ' ')"
          cmake @cmakeArgs

      - name: Build Project
        run: cmake --build build --config ${{ inputs.build_type }} --parallel

      - name: Set Executable Path
        id: set_exe
        run: |
          if ($IsWindows) {
            # On Windows, executables are in bin/Release or bin/Debug
            $exePath = ".\build\bin\loom.exe"
          } else {
            # On Unix systems, executables are in bin/
            $exePath = "./build/bin/loom"
          }
          
          # Check if the executable exists
          if (Test-Path $exePath) {
            Write-Host "Found Loom executable at: $exePath"
          } else {
            Write-Host "Executable not found at: $exePath"
            Write-Host "Searching for loom executable..."
            Get-ChildItem -Path "./build" -Recurse -Name "loom*" | Write-Host
          }
          
          echo "path=$exePath" >> $env:GITHUB_OUTPUT

      - name: Test Loom Executable
        run: |
          $exe = "${{ steps.set_exe.outputs.path }}"
          if (Test-Path $exe) {
            Write-Host "Testing Loom executable..."
            & $exe --version
            & $exe --help
          } else {
            Write-Host "Executable not found, skipping tests"
          }

      - name: Run Basic Tests
        run: |
          $exe = "${{ steps.set_exe.outputs.path }}"
          if (Test-Path $exe) {
            Write-Host "Running basic tests..."
            # Test with some basic .loom files if they exist
            if (Test-Path "*.loom") {
              $loomFiles = Get-ChildItem -Name "*.loom" | Select-Object -First 3
              foreach ($file in $loomFiles) {
                Write-Host "Testing with: $file"
                & $exe $file
              }
            }
          } else {
            Write-Host "Executable not found, skipping tests"
          }

      - name: Package Artifact
        run: |
          $exe = "${{ steps.set_exe.outputs.path }}"
          # Create a staging directory
          mkdir staging
          
          # Copy main executable if it exists
          if (Test-Path $exe) {
            Copy-Item -Path $exe -Destination ./staging
          } else {
            Write-Host "Warning: Executable not found for packaging"
          }
          
          # Copy documentation
          if (Test-Path "README.md") {
            Copy-Item -Path "README.md" -Destination ./staging
          }
          if (Test-Path "CHANGELOG.md") {
            Copy-Item -Path "CHANGELOG.md" -Destination ./staging
          }
          if (Test-Path "LICENSE*") {
            Copy-Item -Path "LICENSE*" -Destination ./staging
          }
          
          # Copy stdlib if it exists
          if (Test-Path "./stdlib") {
            Copy-Item -Path "./stdlib" -Destination ./staging -Recurse
          }
          
          # Archive based on OS
          if ($IsWindows) {
            Compress-Archive -Path ./staging/* -DestinationPath "${{ inputs.artifact_name }}.zip"
          } else {
            tar czf "${{ inputs.artifact_name }}.tar.gz" -C staging .
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_name }}.* # Uploads .zip or .tar.gz