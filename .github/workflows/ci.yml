name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  test:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          # Windows builds
          - {
              name: "Windows MSVC",
              os: windows-latest,
              cmake_generator: "Visual Studio 17 2022",
              cmake_args: "-A x64"
            }
          - {
              name: "Windows Clang",
              os: windows-latest,
              cc: "clang-cl",
              cxx: "clang-cl",
              cmake_generator: "Ninja"
            }
          # Linux builds
          - {
              name: "Ubuntu GCC",
              os: ubuntu-latest,
              cc: "gcc",
              cxx: "g++",
              cmake_generator: "Ninja"
            }
          - {
              name: "Ubuntu Clang",
              os: ubuntu-latest,
              cc: "clang",
              cxx: "clang++",
              cmake_generator: "Ninja"
            }
          # macOS builds
          - {
              name: "macOS Clang",
              os: macos-latest,
              cc: "clang",
              cxx: "clang++",
              cmake_generator: "Ninja"
            }
          - {
              name: "macOS Apple Clang (Intel)",
              os: macos-13, # Use an older runner for Intel architecture
              cc: "clang",
              cxx: "clang++",
              cmake_generator: "Ninja",
              cmake_args: "-DCMAKE_OSX_ARCHITECTURES=x86_64"
            }

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Latest LLVM
      uses: KyleMayes/install-llvm-action@v1
      with:
        version: 'latest' # Installs the latest stable version of LLVM

    - name: Configure CMake
      run: |
        cmake -B build `
          -G "${{ matrix.config.cmake_generator }}" `
          ${{ matrix.config.cmake_args }} `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      shell: pwsh # Use PowerShell for cross-platform consistency
      env:
        # Set compilers only for the specific jobs that need them
        CC: ${{ matrix.config.cc }}
        CXX: ${{ matrix.config.cxx }}

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Test Basic Functionality
      run: |
        # Use a variable for the executable path to simplify commands
        if ($isWindows) {
          $exe = "./build/bin/Release/loom.exe"
        } else {
          $exe = "./build/bin/loom"
        }
        & $exe version
        & $exe help
        & $exe info
      shell: pwsh

    - name: Test Sample Programs
      run: |
        if ($isWindows) {
          $exe = "./build/bin/Release/loom.exe"
        } else {
          $exe = "./build/bin/loom"
        }
        echo 'func main() i32 { return 0; }' > test_basic.loom
        & $exe check test_basic.loom
        & $exe compile test_basic.loom
      shell: pwsh

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: loom-${{ matrix.config.name }}-${{ github.sha }}
        path: |
          build/bin/loom*
          build/bin/Release/loom*
          !build/**/*.pdb
        retention-days: 7

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install latest clang-format
      run: sudo apt-get update && sudo apt-get install -y clang-format

    - name: Check formatting
      run: |
        find . -type f \( -name "*.cc" -o -name "*.hh" \) | xargs clang-format --dry-run --Werror

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v3
      with:
        languages: cpp
        # Let CodeQL auto-detect the build process
        queries: +security-and-quality

    - name: Autobuild for CodeQL
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3