name: CI

on:
  push:
    branches: [ main, dev, ci_testing, experiments ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  # =====================================================
  #  Call the reusable workflow for each configuration
  # =====================================================
  windows-msvc:
    uses: ./.github/workflows/reusable-build.yml
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release, Debug ]
    with:
      os: windows-latest
      build_type: ${{ matrix.build_type }}
      cmake_generator: "Visual Studio 17 2022"
      cmake_args: "-A x64"
      artifact_name: loom-windows-${{ matrix.build_type }}

  linux-clang:
    uses: ./.github/workflows/reusable-build.yml
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release, Debug ]
    with:
      os: ubuntu-22.04
      build_type: ${{ matrix.build_type }}
      cc: clang
      cxx: clang++
      cmake_generator: "Ninja"
      artifact_name: loom-linux-${{ matrix.build_type }}

  macos-clang:
    uses: ./.github/workflows/reusable-build.yml
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release, Debug ]
    with:
      os: macos-13 # Use a specific version for stability
      build_type: ${{ matrix.build_type }}
      cc: clang
      cxx: clang++
      cmake_generator: "Ninja"
      artifact_name: loom-macos-${{ matrix.build_type }}

  # =====================================================
  #  Release Job - Gathers artifacts from other jobs
  # =====================================================
  release:
    name: Create Pre-release
    runs-on: ubuntu-latest
    # This job depends on the successful completion of the main release builds
    needs: [ windows-msvc, linux-clang, macos-clang ]
    # Only run when pushing to the main branch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write # Required to create a release

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts # Download all artifacts into an 'artifacts' directory

      - name: List downloaded files
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-prerelease
          name: "Latest Development Build"
          body: "Automated pre-release build. Contains the latest features and fixes from the main branch."
          prerelease: true
          # This will automatically delete the previous 'latest-prerelease' tag and release
          make_latest: 'legacy'
          # Use a wildcard to upload all downloaded artifact files (.zip and .tar.gz)
          files: artifacts/**/*.*