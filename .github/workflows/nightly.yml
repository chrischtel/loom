name: Nightly Build

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  # This job calls the reusable workflow for each target platform
  build-nightly-artifacts:
    uses: ./.github/workflows/reusable-build.yml
    strategy:
      fail-fast: false
      matrix:
        # Define all your nightly build targets here
        include:
          - { os: windows-latest, artifact_name: "loom-nightly-windows-x64", cmake_generator: "Visual Studio 17 2022", cmake_args: "-A x64" }
          - { os: ubuntu-22.04, artifact_name: "loom-nightly-linux-x64", cmake_generator: "Ninja", cc: "clang", cxx: "clang++" }
          - { os: macos-latest, artifact_name: "loom-nightly-macos-arm64", cmake_generator: "Ninja", cc: "clang", cxx: "clang++", cmake_args: "-DCMAKE_OSX_ARCHITECTURES=arm64" }
    with:
      os: ${{ matrix.os }}
      build_type: Debug # Nightly builds are typically Debug
      cc: ${{ matrix.cc }}
      cxx: ${{ matrix.cxx }}
      cmake_generator: ${{ matrix.cmake_generator }}
      cmake_args: ${{ matrix.cmake_args }}
      artifact_name: ${{ matrix.artifact_name }}

  # This job collects all the artifacts and creates/updates the nightly GitHub Release
  create-nightly-release:
    name: Publish Nightly Release
    runs-on: ubuntu-latest
    needs: build-nightly-artifacts
    permissions:
      contents: write # Required to create/update releases
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts # Download all artifacts into an 'artifacts' directory

      - name: List downloaded files for verification
        run: ls -R artifacts

      - name: Get current date for release name
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create or Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          # Always use the same 'nightly' tag
          tag_name: nightly
          name: "Nightly Build (${{ steps.date.outputs.date }})"
          body: |
            ## 🤖 Loom Nightly Build

            This is an automated development build from the latest commit on the `main` branch.
            
            **⚠️ Warning:** These builds are unstable and intended for testing purposes only.

            **Commit:** `${{ github.sha }}`
            
            ---
            
            ### Downloads
            
            * **Windows (x64):** `loom-nightly-windows-x64.zip`
            * **Linux (x64):** `loom-nightly-linux-x64.tar.gz`
            * **macOS (Apple Silicon):** `loom-nightly-macos-arm64.tar.gz`
          prerelease: true
          # This will automatically delete the previous 'nightly' release and tag
          make_latest: 'legacy'
          # Use a wildcard to upload all downloaded artifact files
          files: artifacts/**/*.*