name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # This job calls the reusable workflow for each target platform
  build-release-artifacts:
    uses: ./.github/workflows/reusable-build.yml
    strategy:
      fail-fast: false
      matrix:
        # Define all your release targets here
        include:
          - { os: windows-latest, artifact_name: "loom-windows-x64", cmake_generator: "Visual Studio 17 2022", cmake_args: "-A x64" }
          - { os: ubuntu-22.04, artifact_name: "loom-linux-x64", cmake_generator: "Ninja", cc: "clang", cxx: "clang++" }
          - { os: macos-13, artifact_name: "loom-macos-x64", cmake_generator: "Ninja", cc: "clang", cxx: "clang++", cmake_args: "-DCMAKE_OSX_ARCHITECTURES=x86_64" }
          - { os: macos-latest, artifact_name: "loom-macos-arm64", cmake_generator: "Ninja", cc: "clang", cxx: "clang++", cmake_args: "-DCMAKE_OSX_ARCHITECTURES=arm64" }
    with:
      os: ${{ matrix.os }}
      build_type: Release
      cc: ${{ matrix.cc }}
      cxx: ${{ matrix.cxx }}
      cmake_generator: ${{ matrix.cmake_generator }}
      cmake_args: ${{ matrix.cmake_args }}
      artifact_name: ${{ matrix.artifact_name }}

  # This job collects all the artifacts and creates the GitHub Release
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release-artifacts
    permissions:
      contents: write # Required to create a release
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts # Download all artifacts into an 'artifacts' directory

      - name: List downloaded files for verification
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # Use the tag that triggered the workflow as the release name
          name: "Loom ${{ github.ref_name }}"
          # Use a wildcard to upload all downloaded artifact files (.zip and .tar.gz)
          files: artifacts/**/*.*
          # Automatically generate release notes from commits since the last tag
          generate_release_notes: true