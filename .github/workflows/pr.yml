name: Pull Request Validation

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  # Job 1: Validate the PR title and changelog
  validate:
    name: Validate PR Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # Needed to compare with base branch

      - name: Check PR Title (Conventional Commit)
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if [[ "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore|ci|build|perf)(\(.+\))?!?:[[:space:]].+ ]]; then
            echo "✅ PR title follows conventional commit format."
          else
            echo "❌ PR title does not follow conventional commit format."
            echo "Example: 'feat(parser): add support for unions'"
            exit 1
          fi

      - name: Check for CHANGELOG.md update
        run: |
          # Only check for changelog if PR is not marked as trivial
          if [[ ! "${{ github.event.pull_request.title }}" =~ ^(chore|docs|ci) ]]; then
            if git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | grep -q "CHANGELOG.md"; then
              echo "✅ CHANGELOG.md was updated."
            else
              echo "⚠️ CHANGELOG.md was not updated. Please consider adding an entry for non-trivial changes."
            fi
          fi

  # Job 2: Run a single, fast build to ensure the PR compiles
  quick-build:
    name: Quick Build (Ubuntu)
    uses: ./.github/workflows/reusable-build.yml
    with:
      os: ubuntu-latest
      build_type: Debug
      cc: clang
      cxx: clang++
      cmake_generator: "Ninja"
      artifact_name: pr-build-check # Temporary artifact

  # Job 3: Post a summary comment on the PR
  comment-on-pr:
    name: Post Summary Comment
    runs-on: ubuntu-latest
    needs: [validate, quick-build]
    if: always() # Run even if previous jobs fail
    permissions:
      pull-requests: write
    steps:
      - name: Generate PR Comment
        id: generate_comment
        run: |
          validate_status="${{ needs.validate.result }}"
          build_status="${{ needs.quick-build.result }}"
          
          # Determine overall status and emoji
          if [[ "$validate_status" == "success" && "$build_status" == "success" ]]; then
            overall_status="All checks passed! This PR is ready for review. 🎉"
          else
            overall_status="Some checks failed. Please review the logs and fix any issues. ⚠️"
          fi

          # Create the comment body
          body="### 🤖 PR Validation Summary\n\n"
          body+="| Check | Status |\n"
          body+="|---|---|\n"
          body+="| PR Metadata | ${{ needs.validate.result == 'success' && '✅' || '❌' }} |\n"
          body+="| Quick Build (Ubuntu) | ${{ needs.quick-build.result == 'success' && '✅' || '❌' }} |\n\n"
          body+="$overall_status"
          
          # Escape for multiline output
          body="${body//'%'/'%25'}"
          body="${body//$'\n'/'%0A'}"
          body="${body//$'\r'/'%0D'}"
          
          echo "comment_body=$body" >> $GITHUB_OUTPUT

      - name: Find Previous Comment
        uses: peter-evans/find-comment@v3
        id: find_comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'PR Validation Summary'

      - name: Create or Update Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.generate_comment.outputs.comment_body }}
          edit-mode: replace