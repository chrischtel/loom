name: Pull Request

on:
  pull_request:
    branches: [ main, develop ]
  pull_request_target:
    types: [ opened, synchronize, reopened ]

env:
  BUILD_TYPE: Debug

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Check PR title
      run: |
        PR_TITLE="${{ github.event.pull_request.title }}"
        echo "PR Title: $PR_TITLE"
        
        # Check if title follows conventional commit format
        if [[ "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore|ci|build|perf)(\(.+\))?: .+ ]]; then
          echo "✅ PR title follows conventional commit format"
        else
          echo "❌ PR title should follow conventional commit format"
          echo "Examples:"
          echo "  feat: add new string builtin functions"
          echo "  fix: resolve memory leak in parser"
          echo "  docs: update installation instructions"
          echo "  refactor(parser): simplify expression parsing"
          exit 1
        fi

    - name: Check for required files
      run: |
        echo "Checking for required files..."
        
        # Check if CHANGELOG.md was updated for non-trivial changes
        if git diff --name-only origin/main..HEAD | grep -E '\.(cc|hh|cpp|hpp|c|h)$' > /dev/null; then
          if ! git diff --name-only origin/main..HEAD | grep -q "CHANGELOG.md"; then
            echo "⚠️  Code changes detected but CHANGELOG.md not updated"
            echo "Consider updating CHANGELOG.md for significant changes"
          else
            echo "✅ CHANGELOG.md updated"
          fi
        fi

  quick-build:
    name: Quick Build Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - name: Setup LLVM
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 17
        sudo apt-get update
        sudo apt-get install -y llvm-17-dev libllvm17 llvm-17-tools ninja-build
        echo "LLVM_DIR=/usr/lib/llvm-17/lib/cmake/llvm" >> $GITHUB_ENV

    - name: Configure and Build
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_C_COMPILER=clang-14 \
          -DCMAKE_CXX_COMPILER=clang++-14
        cmake --build build --parallel

    - name: Quick Test
      run: |
        ./build/bin/loom version
        ./build/bin/loom help

  diff-analysis:
    name: Analyze Changes
    runs-on: ubuntu-latest
    steps:
    - name: Checkout base
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base

    - name: Checkout head
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: head

    - name: Analyze code changes
      run: |
        echo "## Code Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Count changed files by type
        cd head
        CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
        
        echo "### Changed Files" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "$CHANGED_FILES" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Analyze file types
        CC_FILES=$(echo "$CHANGED_FILES" | grep -E '\.(cc|cpp|c)$' | wc -l)
        HH_FILES=$(echo "$CHANGED_FILES" | grep -E '\.(hh|hpp|h)$' | wc -l)
        CMAKE_FILES=$(echo "$CHANGED_FILES" | grep -E 'CMakeLists\.txt|\.cmake$' | wc -l)
        MD_FILES=$(echo "$CHANGED_FILES" | grep -E '\.md$' | wc -l)
        LOOM_FILES=$(echo "$CHANGED_FILES" | grep -E '\.loom$' | wc -l)
        
        echo "### File Type Summary" >> $GITHUB_STEP_SUMMARY
        echo "- C++ Source Files: $CC_FILES" >> $GITHUB_STEP_SUMMARY
        echo "- C++ Header Files: $HH_FILES" >> $GITHUB_STEP_SUMMARY
        echo "- CMake Files: $CMAKE_FILES" >> $GITHUB_STEP_SUMMARY
        echo "- Markdown Files: $MD_FILES" >> $GITHUB_STEP_SUMMARY
        echo "- Loom Files: $LOOM_FILES" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Count lines of code changes
        INSERTIONS=$(git diff --stat ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | tail -1 | grep -o '[0-9]\+ insertion' | grep -o '[0-9]\+' || echo "0")
        DELETIONS=$(git diff --stat ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | tail -1 | grep -o '[0-9]\+ deletion' | grep -o '[0-9]\+' || echo "0")
        
        echo "### Code Changes" >> $GITHUB_STEP_SUMMARY
        echo "- Lines Added: $INSERTIONS" >> $GITHUB_STEP_SUMMARY
        echo "- Lines Removed: $DELETIONS" >> $GITHUB_STEP_SUMMARY

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Run security checks
      run: |
        echo "Running basic security checks..."
        
        # Check for potential security issues
        echo "Checking for hardcoded secrets..."
        if grep -r -i -E "(password|secret|key|token|api_key)" --include="*.cc" --include="*.hh" --include="*.cpp" --include="*.hpp" . | grep -v "test" | grep -v "example"; then
          echo "⚠️  Potential hardcoded secrets found (review carefully)"
        else
          echo "✅ No obvious hardcoded secrets found"
        fi
        
        echo "Checking for unsafe C functions..."
        if grep -r -E "(strcpy|strcat|sprintf|gets|system)" --include="*.cc" --include="*.cpp" .; then
          echo "⚠️  Potentially unsafe C functions found"
        else
          echo "✅ No unsafe C functions found"
        fi

  auto-format-check:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Install clang-format
      run: sudo apt-get install -y clang-format-14

    - name: Check formatting
      run: |
        echo "Checking code formatting..."
        UNFORMATTED_FILES=$(find compiler -name "*.cc" -o -name "*.hh" | xargs clang-format-14 --dry-run --Werror 2>&1 | grep "error:" | cut -d: -f1 | sort | uniq || true)
        
        if [ -n "$UNFORMATTED_FILES" ]; then
          echo "❌ The following files need formatting:"
          echo "$UNFORMATTED_FILES"
          echo ""
          echo "To fix, run:"
          echo "  clang-format -i \$(find compiler -name '*.cc' -o -name '*.hh')"
          exit 1
        else
          echo "✅ All files are properly formatted"
        fi

  comment-pr:
    name: Comment on PR
    needs: [validate, quick-build, diff-analysis, security-check, auto-format-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Comment PR
      uses: actions/github-script@v7
      with:
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && comment.body.includes('PR Check Results')
          );
          
          const validateResult = '${{ needs.validate.result }}';
          const buildResult = '${{ needs.quick-build.result }}';
          const diffResult = '${{ needs.diff-analysis.result }}';
          const securityResult = '${{ needs.security-check.result }}';
          const formatResult = '${{ needs.auto-format-check.result }}';
          
          const getEmoji = (result) => {
            switch(result) {
              case 'success': return '✅';
              case 'failure': return '❌';
              case 'cancelled': return '⏹️';
              case 'skipped': return '⏭️';
              default: return '⏳';
            }
          };
          
          const body = `## 🤖 PR Check Results
          
          | Check | Status | Result |
          |-------|--------|---------|
          | Validation | ${getEmoji(validateResult)} | ${validateResult} |
          | Quick Build | ${getEmoji(buildResult)} | ${buildResult} |
          | Diff Analysis | ${getEmoji(diffResult)} | ${diffResult} |
          | Security Check | ${getEmoji(securityResult)} | ${securityResult} |
          | Code Formatting | ${getEmoji(formatResult)} | ${formatResult} |
          
          ${buildResult === 'success' ? '🎉 PR looks good for review!' : '⚠️ Some checks failed - please review and fix issues.'}
          
          ---
          *This comment is automatically updated on each push.*`;
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }
